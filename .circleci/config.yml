version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@3.0.0

jobs:
  test-and-scan:
    docker:
      - image: cimg/node:20.11
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: cd backend && npm ci
      - sonarcloud/scan
      - run:
          name: Software composition analysis (npm audit)
          command: cd backend && npm audit --audit-level=high || echo "Review audit findings above before merging"
      - run:
          name: Run API tests
          command: cd backend && npm test
      - run:
          name: Lint
          command: cd backend && npm run lint || true

workflows:
  build-test-scan:
    jobs:
      - test-and-scan:
          context: sonarcloud